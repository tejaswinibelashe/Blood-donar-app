<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0505 100%);
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .auth-logo h2 {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .form-section-title {
            color: var(--primary);
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-droplet"></i>
                <h2>Create an Account</h2>
                <p class="text-muted">Join the BloodLink network today</p>
            </div>
            
            <form id="registerForm" onsubmit="event.preventDefault(); window.location.href='index.html';">
                
                <h4 class="form-section-title">Personal Details</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control form-control-dark" min="18" max="65" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select form-control-dark" required>
                            <option value="">Select...</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <h4 class="form-section-title">Contact & Location</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Pincode</label>
                        <input type="text" class="form-control form-control-dark" required>
                    </div>
                </div>

                <h4 class="form-section-title">Blood & Account Setup</h4>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Blood Group</label>
                        <select class="form-select form-control-dark" required>
                            <option value="">Select...</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>O+</option><option>O-</option>
                            <option>AB+</option><option>AB-</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Register As</label>
                        <select class="form-select form-control-dark" required>
                            <option>Donor</option>
                            <option>Patient / Requester</option>
                            <option>Hospital</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Profile Picture</label>
                        <input type="file" class="form-control form-control-dark">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-dark" id="pwd" required>
                        <div class="form-text text-muted">Must be 8-20 characters long.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control form-control-dark" required>
                    </div>
                </div>

                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label text-muted" for="terms">
                        I agree to the Terms & Conditions and Privacy Policy.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary-dark w-100 mt-4 py-2" style="font-size: 18px; font-weight: 600;">Register Now</button>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? <a href="login.html" style="color: var(--primary);">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
