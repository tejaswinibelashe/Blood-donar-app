<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Sign In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0505 100%);
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .auth-logo h2 {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-droplet"></i>
                <h2>BloodLink</h2>
                <p class="text-muted">Sign in to your account</p>
            </div>
            
            <form id="loginForm">
                
                <div id="loginError" class="alert alert-danger d-none" role="alert">
                    Invalid Email or Password
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="emailField" class="form-control form-control-dark" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group password-container">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="passwordField" class="form-control form-control-dark" required>
                        <i class="fa-solid fa-eye password-toggle" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label text-muted" for="remember">
                            Remember Me
                        </label>
                    </div>
                    <a href="forgot-password.html" style="color: var(--primary); font-size: 14px; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary-dark w-100 py-2" style="font-size: 18px; font-weight: 600;">Sign In</button>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Don't have an account? <a href="register.html" style="color: var(--primary); font-weight:600; text-decoration:none;">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const icon = document.querySelector('.password-toggle');
            if (field.type === "password") {
                field.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailField').value;
            const password = document.getElementById('passwordField').value;
            const errorDiv = document.getElementById('loginError');
            const submitBtn = this.querySelector('button[type="submit"]');

            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Signing In...';
            submitBtn.disabled = true;
            errorDiv.classList.add('d-none');

            const apiHost = (window.location.hostname && window.location.hostname !== '') ? window.location.hostname : 'localhost';
            fetch(`http://${apiHost}:8080/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(res => {
                if(!res.ok) throw new Error('Invalid Credentials');
                return res.json();
            })
            .then(data => {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.replace('index.html');
            })
            .catch(err => {
                errorDiv.innerText = err.message === 'Failed to fetch' ? 'Unable to connect to server' : 'Invalid Email or Password';
                errorDiv.classList.remove('d-none');
                submitBtn.innerHTML = 'Sign In';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
