<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Forgot Password</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a0505 100%);
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-logo i {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-lock"></i>
                <h2>Reset Password</h2>
            </div>
            
            <!-- Step 1: Request OTP -->
            <div id="step1" class="step active">
                <p class="text-muted text-center mb-4">Enter your email address and we'll send you an OTP to reset your password.</p>
                <form onsubmit="event.preventDefault(); document.getElementById('step1').classList.remove('active'); document.getElementById('step2').classList.add('active');">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-dark" required>
                    </div>
                    <button type="submit" class="btn btn-primary-dark w-100 py-2">Send OTP</button>
                </form>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="step2" class="step">
                <p class="text-muted text-center mb-4">Enter the 6-digit OTP sent to your email.</p>
                <form onsubmit="event.preventDefault(); document.getElementById('step2').classList.remove('active'); document.getElementById('step3').classList.add('active');">
                    <div class="mb-3">
                        <label class="form-label">OTP Code</label>
                        <input type="text" class="form-control form-control-dark text-center" style="font-size: 24px; letter-spacing: 5px;" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary-dark w-100 py-2">Verify OTP</button>
                </form>
            </div>

            <!-- Step 3: New Password -->
            <div id="step3" class="step">
                <p class="text-muted text-center mb-4">Create a new secure password.</p>
                <form onsubmit="event.preventDefault(); alert('Password successfully changed!'); window.location.href='login.html';">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control form-control-dark" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control form-control-dark" required>
                    </div>
                    <button type="submit" class="btn btn-primary-dark w-100 py-2">Reset Password</button>
                </form>
            </div>

            <div class="text-center mt-4">
                <a href="login.html" style="color: var(--text-muted); text-decoration:none;"><i class="fa-solid fa-arrow-left me-2"></i> Back to Login</a>
            </div>
        </div>
    </div>

</body>
</html>
